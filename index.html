<style>
:root {
  /* Leonida at dusk: purple night ground, hot-pink neon accent, teal and sunset orange support; sunset hero over one column of cards */
  --ground: #120c24;
  --panel: #1c1438;
  --line: #3a2b5e;
  --ink: #f6f0ff;
  --muted: #b5a8d4;
  --accent: #ff3e9a;
  --teal: #2ee6d6;
  --sunset: #ffa24c;
  --good: #4fe0a8;
  --warn: #ffd45c;
  --bad: #ff5d6e;
  --info: #7fb8ff;
  --brand: "Bungee", "Arial Black", Impact, sans-serif;
  --display: "Anton", Impact, "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--ground); color: var(--ink); font: 15px/1.5 var(--body); }
.wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 64px; display: grid; gap: 20px; }
header { display: grid; gap: 12px; }
.hero { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #2a1250; }
.hero img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 1; object-fit: cover; }
.hero .brand { padding: 14px 20px 16px; display: grid; gap: 6px; background: var(--panel); border-top: 2px solid var(--accent); }
h1 { font: 44px/1.02 var(--brand); margin: 0; color: #fff; text-shadow: 0 0 18px rgba(255, 62, 154, .55), 3px 3px 0 #1a0b36; text-wrap: balance; }
h1 span { color: var(--accent); text-shadow: 0 0 20px rgba(255, 62, 154, .7), 3px 3px 0 #1a0b36; }
.tagline { font: 600 12px/1 var(--mono); letter-spacing: 2px; text-transform: uppercase; color: var(--teal); text-shadow: 0 0 10px rgba(46, 230, 214, .5); }
.meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
.meta b { color: var(--ink); font-weight: 600; }
section { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: 10px; padding: 16px 18px; display: grid; gap: 12px; }
section:nth-of-type(3n+2) { border-top-color: var(--teal); }
section:nth-of-type(3n) { border-top-color: var(--sunset); }
h2 { font: 22px/1.1 var(--display); letter-spacing: .6px; text-transform: uppercase; margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
h2 small { font: 500 12px var(--body); color: var(--muted); text-transform: none; letter-spacing: 0; }
.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.item { display: grid; gap: 4px; padding: 10px 0 10px 12px; border-left: 3px solid var(--line); }
.item.CONFIRMED { border-left-color: var(--good); }
.item.REPORTED { border-left-color: var(--info); }
.item.RUMOR { border-left-color: var(--warn); }
.item.WARNING { border-left-color: var(--bad); }
.item .top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.item .title { font-weight: 600; }
.item p { margin: 0; color: var(--ink); max-width: 65ch; }
.item .src { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
a { color: var(--teal); text-underline-offset: 2px; }
a:hover { color: var(--accent); }
a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.pill { font: 500 11px/1 var(--mono); letter-spacing: .4px; padding: 4px 6px; border-radius: 4px; border: 1px solid currentColor; text-transform: uppercase; }
.pill.CONFIRMED { color: var(--good); }
.pill.REPORTED { color: var(--info); }
.pill.RUMOR { color: var(--warn); }
.pill.WARNING { color: var(--bad); }
.pill.status-working { color: var(--good); }
.pill.status-patched { color: var(--muted); }
.pill.status-unconfirmed { color: var(--warn); }
.empty { color: var(--muted); font-size: 14px; margin: 0; }
details { border-top: 1px dashed var(--line); padding-top: 10px; }
summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.progress { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.progress b { color: var(--ink); }
.progress .stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.progress button, .progress input { font: 600 14px var(--body); color: var(--ink); background: transparent; border: 0; height: 32px; }
.progress button { width: 32px; cursor: pointer; }
.progress button:hover { background: var(--line); }
.progress input { width: 48px; text-align: center; font-variant-numeric: tabular-nums; border-left: 1px solid var(--line); border-right: 1px solid var(--line); -moz-appearance: textfield; }
.progress input::-webkit-outer-spin-button, .progress input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.progress .clear { width: auto; padding: 0 10px; font-weight: 500; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; }
.item .inner { display: grid; gap: 4px; }
.item.locked .inner { filter: blur(7px); user-select: none; pointer-events: none; }
.item.locked.revealed .inner { filter: none; user-select: auto; pointer-events: auto; }
.reveal { justify-self: start; font: 500 12px/1 var(--mono); letter-spacing: .3px; color: var(--accent); background: rgba(255, 62, 154, .08); border: 1px solid var(--accent); border-radius: 6px; padding: 7px 10px; cursor: pointer; }
.reveal:hover { background: rgba(255, 62, 154, .18); }
.reveal:focus-visible, .progress button:focus-visible, .progress input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.item.locked.revealed .reveal { display: none; }
@media (prefers-reduced-motion: no-preference) { .item .inner { transition: filter .2s ease; } }
.legend { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; color: var(--muted); align-items: center; }
footer { color: var(--muted); font-size: 12px; text-align: left; }
@media (max-width: 560px) { .hero .brand { padding: 12px 16px 14px; } h1 { font-size: 30px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hero">
      <img src="banner-beach.jpg" width="2000" height="667" alt="A woman in a bikini lounging with a clam in gold sunglasses and a gold chain, surrounded by whiskey, energy drinks and snacks, with burning cars and a crashed plane on a sunset beach behind them">
      <div class="brand">
        <span class="tagline">GTA 6 story-mode co-pilot</span>
        <h1>Feeling Sixy <span>with my Clam</span></h1>
      </div>
    </div>
    <div class="meta" id="meta"></div>
    <div class="progress" id="progress"></div>
    <div class="legend"><span class="pill CONFIRMED">Confirmed</span>multiple sources <span class="pill REPORTED">Reported</span>one source <span class="pill RUMOR">Rumor</span>unverified <span class="pill WARNING">Heads up</span>spoiler or risk</div>
  </header>
  <main id="app" style="display:grid;gap:20px"></main>
  <footer>Story mode only. Anything tied to a story mission or upgrade past your progress is blurred until you tap it. Your progress is saved on this device only.</footer>
</div>

<script>
(function () {
  var d;
  try { d = JSON.parse(document.getElementById('data').textContent); } catch (e) { d = null; }
  var app = document.getElementById('app');
  if (!d) { app.innerHTML = '<p class="empty">The update data is broken. The next scan will rewrite it.</p>'; return; }

  var KEY = 'sixyclam-missions-done';
  function loadProg() { try { var v = localStorage.getItem(KEY); return v === null ? null : Math.max(0, parseInt(v, 10) || 0); } catch (e) { return null; } }
  function saveProg(v) { try { if (v === null) localStorage.removeItem(KEY); else localStorage.setItem(KEY, String(v)); } catch (e) {} }
  var prog = loadProg();

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : '#'; }
  function fmt(iso) {
    var t = new Date(iso);
    if (isNaN(t)) return esc(iso);
    return t.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York' }) + ' ET';
  }
  function next(iso) { var t = new Date(iso); if (isNaN(t)) return ''; t = new Date(t.getTime() + 4 * 3600e3); return fmt(t.toISOString()); }

  // An item is blurred when it is tied to a mission past the viewer's progress,
  // or marked as a spoiler with no mission the viewer has already finished.
  function locked(x) {
    var after = (typeof x.afterMission === 'number') ? x.afterMission : null;
    if (after !== null) return prog === null || after > prog;
    return !!x.spoiler;
  }
  function lockLabel(x) {
    if (typeof x.afterMission === 'number') return 'Spoiler: after story mission ' + x.afterMission + '. Tap to show';
    return 'Spoiler. Tap to show';
  }

  function item(x) {
    var tag = ['CONFIRMED','REPORTED','RUMOR','WARNING'].indexOf(x.tag) > -1 ? x.tag : 'REPORTED';
    var label = tag === 'WARNING' ? 'Heads up' : tag;
    var extra = '';
    if (x.status) extra += '<span class="pill status-' + esc(x.status) + '">' + esc(x.status) + '</span>';
    if (x.version) extra += '<span class="pill">v' + esc(x.version) + '</span>';
    if (typeof x.afterMission === 'number') extra += '<span class="pill">After mission ' + esc(x.afterMission) + '</span>';
    else if (x.availableAfter) extra += '<span class="pill">After: ' + esc(x.availableAfter) + '</span>';
    var src = (x.sources || []).map(function (s) { return '<a href="' + esc(safeUrl(s.url)) + '" target="_blank" rel="noopener">' + esc(s.name) + '</a>'; }).join('');
    if (x.video) src += '<a href="' + esc(safeUrl(x.video)) + '" target="_blank" rel="noopener">Watch video</a>';
    var isLocked = locked(x);
    var inner = '<div class="inner"' + (isLocked ? ' aria-hidden="true"' : '') + '><div class="top"><span class="pill ' + tag + '">' + label + '</span>' + extra + '<span class="title">' + esc(x.title) + '</span></div>' +
      (x.body ? '<p>' + esc(x.body) + '</p>' : '') +
      '<div class="src">' + (x.date ? '<span>' + esc(x.date) + '</span>' : '') + src + '</div></div>';
    if (!isLocked) return '<li class="item ' + tag + '">' + inner + '</li>';
    return '<li class="item locked ' + tag + '"><button type="button" class="reveal">' + esc(lockLabel(x)) + '</button>' + inner + '</li>';
  }
  function list(arr, emptyText) {
    if (!arr || !arr.length) return '<p class="empty">' + esc(emptyText) + '</p>';
    return '<ul class="items">' + arr.map(item).join('') + '</ul>';
  }
  function section(title, note, inner) {
    return '<section><h2>' + esc(title) + (note ? ' <small>' + esc(note) + '</small>' : '') + '</h2>' + inner + '</section>';
  }

  function renderProgress() {
    var el = document.getElementById('progress');
    var val = prog === null ? '' : prog;
    el.innerHTML = '<span><b>My progress:</b> story missions finished</span>' +
      '<span class="stepper"><button type="button" id="p-down" aria-label="One fewer mission">&minus;</button>' +
      '<input id="p-val" type="number" inputmode="numeric" min="0" max="300" value="' + val + '" placeholder="?" aria-label="Story missions finished">' +
      '<button type="button" id="p-up" aria-label="One more mission">+</button></span>' +
      (prog === null ? '<span>Not set: every mission spoiler stays blurred.</span>' : '<button type="button" class="clear" id="p-clear">Clear</button>');
    document.getElementById('p-down').onclick = function () { setProg(Math.max(0, (prog || 0) - 1)); };
    document.getElementById('p-up').onclick = function () { setProg((prog === null ? 0 : prog) + 1); };
    document.getElementById('p-val').onchange = function () { var v = parseInt(this.value, 10); setProg(isNaN(v) ? null : Math.max(0, Math.min(300, v))); };
    var c = document.getElementById('p-clear'); if (c) c.onclick = function () { setProg(null); };
  }
  function setProg(v) { prog = v; saveProg(v); renderProgress(); renderApp(); }

  function renderApp() {
    var patches = (d.patches || []).map(function (p) {
      return { tag: 'CONFIRMED', title: (p.version ? 'v' + p.version + ': ' : '') + (p.title || 'Update'), body: p.body, date: p.date, sources: p.url ? [{ name: 'Details', url: p.url }] : [] };
    });
    app.innerHTML =
      section("What's new", 'since the last scan', list(d.whatsNew, 'Nothing new this scan.')) +
      section('Trending right now', 'what players are doing', list(d.trending, 'Fills in once people are playing.')) +
      section('Open-world tips', 'vehicles, money, hidden spots, prep', list(d.openWorldTips, 'Fills in once people are playing.')) +
      section('Glitches and bugs', 'with version and status', list(d.glitches, 'None reported yet.')) +
      section('Mission branches', 'how missions can play out', list(d.missionBranches, 'None mapped yet.')) +
      section('Missable content', 'what you can lose for good', list(d.missables, 'None confirmed yet.')) +
      section('Patch notes', 'newest first', list(patches, 'No patches yet.'));
  }

  app.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.reveal') : null;
    if (!b) return;
    var li = b.parentNode; li.classList.add('revealed');
    var inner = li.querySelector('.inner'); if (inner) inner.removeAttribute('aria-hidden');
  });

  document.getElementById('meta').innerHTML =
    '<span>Last scan: <b>' + fmt(d.lastUpdated) + '</b></span><span>Next scan: about <b>' + next(d.lastUpdated) + '</b></span>' +
    (d.gameVersion ? '<span>Game version: <b>' + esc(d.gameVersion) + '</b></span>' : '');
  renderProgress();
  renderApp();
})();
</script>
</body>
